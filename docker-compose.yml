services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: octapulse
      POSTGRES_PASSWORD: octapulse
      POSTGRES_DB: octapulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octapulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/octapulse
      DATABASE_URL_DIRECT: jdbc:postgresql://postgres:5432/octapulse
      DATABASE_USERNAME: octapulse
      DATABASE_PASSWORD: octapulse
      CITO_API_KEY: ${CITO_API_KEY}
      CITO_MONTHLY_CAP: ${CITO_MONTHLY_CAP:-450}
      JWT_SECRET: ${JWT_SECRET:-ZT0jIqG52c+i3GqWFMe/M+/8ws4d4312WmYfVIZXsHQ=}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:

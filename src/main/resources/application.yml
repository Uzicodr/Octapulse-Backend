spring:
  application:
    name: octapulse-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    url: ${DATABASE_URL_DIRECT:${DATABASE_URL}}
    user: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-For from Render's proxy so rate limiting sees the real client IP.
  forward-headers-strategy: native
  error:
    include-message: always

app:
  # Used to build password reset links.
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # Comma-separated browser origins allowed by CORS; empty disables CORS (mobile apps don't need it).
  cors-origins: ${CORS_ORIGINS:}

jobs:
  enabled: ${JOBS_ENABLED:true}
  settlement-interval: PT5M
  reminder-interval: PT1H

rate-limit:
  auth-per-minute: ${AUTH_RATE_LIMIT:20}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
